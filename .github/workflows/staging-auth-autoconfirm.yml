name: Staging auth autoconfirm

# Sets "Confirm email" OFF (mailer_autoconfirm=true) on the staging Supabase
# project, as required by docs/PROVISIONING.md §5 for dev/staging testing.
# Uses the existing staging environment secrets; never prints secrets.
# Re-runs automatically if this file changes, or manually via workflow_dispatch.

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/staging-auth-autoconfirm.yml']
  workflow_dispatch:

jobs:
  set-mailer-autoconfirm:
    name: Set staging Confirm email OFF
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Apply mailer_autoconfirm=true via Management API
        run: |
          HTTP=$(curl -s -o cfg.json -w "%{http_code}" \
            --request PATCH \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"mailer_autoconfirm": true}')
          [ "$HTTP" = "200" ] || { echo "Management API returned $HTTP"; jq '.' cfg.json; exit 1; }
          echo "Management API OK: $(jq -c '{mailer_autoconfirm}' cfg.json)"

      - name: Verify via public auth settings
        run: |
          HTTP=$(curl -s -o settings.json -w "%{http_code}" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/auth/v1/settings")
          [ "$HTTP" = "200" ] || { echo "settings returned $HTTP"; cat settings.json; exit 1; }
          jq -e '.mailer_autoconfirm == true' settings.json >/dev/null \
            || { echo "mailer_autoconfirm is not true:"; jq '{mailer_autoconfirm, disable_signup}' settings.json; exit 1; }
          echo "Confirm email is OFF in staging (mailer_autoconfirm=true)."
