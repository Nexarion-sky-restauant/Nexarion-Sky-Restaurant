name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    # Job name = check-run name GitHub reports to branch rulesets; the
    # repository rulesets require a status check named exactly "CI".
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline assertions for scripts/verify-production-domain.sh, which is only
      # exercised live during a production deploy. Needs bash + jq, both present on
      # ubuntu-latest. Runs first so a broken check fails fast, before npm install.
      - name: Domain verification self-tests
        run: bash scripts/verify-production-domain.selftest.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fail on high/critical vulnerabilities in production dependencies.
      # Dev-only findings are handled through Dependabot PRs.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # Build with placeholder env so Vite can resolve the variables; the
      # real per-environment values are injected by the deploy workflows.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_APP_ENV: development
