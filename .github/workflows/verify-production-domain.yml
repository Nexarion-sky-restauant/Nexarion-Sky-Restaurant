name: Verify Production Domain

# Read-only re-verification of the production custom domain.
#
# Why this exists: Cloudflare can take hours to issue a certificate after a
# custom domain is attached. When that happens the production deploy is already
# complete and the site is live on the *.pages.dev alias, so re-running the
# deploy just to re-check the domain would needlessly repeat `supabase db push`
# and re-upload the build (and would raise both production approval gates again).
# Dispatch this workflow instead.
#
# Safety: Cloudflare GET requests plus public HTTPS only. It cannot modify DNS,
# Pages, Supabase, secrets, or PRODUCTION_ENABLED. There are deliberately no
# workflow_dispatch inputs - the domain and project come from repository
# configuration, so this workflow cannot be pointed at another hostname.
#
# There is deliberately no `environment: production`: that environment requires
# a manual reviewer, and a job that changes nothing must not add an approval
# gate. The repository-level CLOUDFLARE_* secrets are available to ungated jobs,
# exactly as in provision-pages-production.yml.

on:
  workflow_dispatch:

concurrency:
  group: verify-production-domain
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production custom domain
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.APP_CUSTOM_DOMAIN }}
      # CLOUDFLARE_PAGES_PROJECT is an environment-scoped variable, so it is not
      # visible to this ungated job. The production Pages project name is stated
      # here, matching provision-pages-production.yml.
      PROJECT: nexarion-sky
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify the custom domain is active and serving the production build
        run: bash scripts/verify-production-domain.sh
