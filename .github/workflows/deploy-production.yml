name: Deploy Production

# Promotion path: GitHub main -> GitHub Actions -> Production Supabase -> Cloudflare Pages -> nexarionsky.com
#
# DISABLED BY DEFAULT. This entire workflow is gated behind the repository variable
# PRODUCTION_ENABLED=true. It must stay disabled until staging has passed the full
# verification checklist (authentication, RLS, database, application, deployment) in
# docs/PROVISIONING.md. To enable production deployment after staging verification:
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables
#   -> add PRODUCTION_ENABLED = true (repo-wide or on the production environment).
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Migration safety: production schema changes must be additive/backwards
      # compatible (expand/contract). Destructive changes need a reviewed plan.
      - name: Push migrations
        run: supabase db push

  build-deploy:
    name: Build and deploy to Cloudflare Pages (production)
    needs: migrate
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # verify-domain deliberately has no `environment:`, so it cannot read the
      # environment-scoped CLOUDFLARE_PAGES_PROJECT variable itself.
      pages_project: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Attach custom domain (idempotent)
        run: |
          HTTP=$(curl -s -o attach.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ vars.CLOUDFLARE_PAGES_PROJECT }}/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"${{ vars.APP_CUSTOM_DOMAIN }}"}')
          # 200 = attached now; 409/8000018 = already attached. Anything else fails.
          if [ "$HTTP" != "200" ]; then
            # Match the documented error code, not a substring anywhere in the body.
            if ! jq -e 'any(.errors[]?; .code == 8000018)' attach.json >/dev/null 2>&1; then
              echo "Failed to attach custom domain (HTTP $HTTP):"; cat attach.json; exit 1
            fi
            echo "Custom domain already attached."
          fi

  verify-domain:
    name: Verify production custom domain
    needs: build-deploy
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Deliberately no `environment: production`. This job only reads, and the
    # production environment requires a manual reviewer, so declaring it here
    # would add a third approval gate to every deploy. Keeping verification in
    # its own job means a pending Cloudflare certificate fails only this job:
    # re-running it never repeats `supabase db push` and never re-uploads the
    # build. The 'Verify Production Domain' workflow re-checks the domain later
    # with no deploy run at all.
    env:
      DOMAIN: ${{ vars.APP_CUSTOM_DOMAIN }}
      PROJECT: ${{ needs.build-deploy.outputs.pages_project }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the custom domain is active and serving this deployment
        run: bash scripts/verify-production-domain.sh
