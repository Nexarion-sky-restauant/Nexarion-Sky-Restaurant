name: Deploy Production

# Promotion path: GitHub main -> GitHub Actions -> Production Supabase -> Cloudflare Pages -> nexarionsky.com
#
# DISABLED BY DEFAULT. This entire workflow is gated behind the repository variable
# PRODUCTION_ENABLED=true. It must stay disabled until staging has passed the full
# verification checklist (authentication, RLS, database, application, deployment) in
# docs/PROVISIONING.md. To enable production deployment after staging verification:
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables
#   -> add PRODUCTION_ENABLED = true (repo-wide or on the production environment).
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Migration safety: production schema changes must be additive/backwards
      # compatible (expand/contract). Destructive changes need a reviewed plan.
      - name: Push migrations
        run: supabase db push

  build-deploy:
    name: Build and deploy to Cloudflare Pages (production)
    needs: migrate
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Attach custom domain (idempotent)
        run: |
          HTTP=$(curl -s -o attach.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ vars.CLOUDFLARE_PAGES_PROJECT }}/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"${{ vars.APP_CUSTOM_DOMAIN }}"}')
          # 200 = attached now; 409/8000018 = already attached. Anything else fails.
          if [ "$HTTP" != "200" ]; then
            if ! grep -q '8000018' attach.json; then
              echo "Failed to attach custom domain (HTTP $HTTP):"; cat attach.json; exit 1
            fi
            echo "Custom domain already attached."
          fi

      - name: Verify custom domain is live
        run: |
          for i in 1 2 3; do
            curl -s \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ vars.CLOUDFLARE_PAGES_PROJECT }}/domains" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" > domains.json
            if grep -q '"name":"${{ vars.APP_CUSTOM_DOMAIN }}"' domains.json; then
              echo "Verified: ${{ vars.APP_CUSTOM_DOMAIN }} is attached to the production deployment."
              exit 0
            fi
            sleep 15
          done
          echo "Custom domain not found after retries:"; cat domains.json; exit 1
